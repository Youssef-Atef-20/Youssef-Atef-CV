name: Build and Deploy CV

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cv-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          latexmk_use_xelatex: false

      - name: Cache PDF.js
        id: pdfjs-cache
        uses: actions/cache@v4
        with:
          path: .pdfjs/node_modules
          key: pdfjs-${{ runner.os }}-5.4.296

      - name: Install PDF.js on cache miss
        if: steps.pdfjs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          npm install --prefix .pdfjs --no-save --no-package-lock --no-audit --no-fund pdfjs-dist@5.4.296

      # Validate the cache too. If it is incomplete, repair it instead of failing later.
      - name: Verify and repair PDF.js installation
        run: |
          set -euo pipefail
          PDFJS_DIR=".pdfjs/node_modules/pdfjs-dist"

          if [ ! -f "$PDFJS_DIR/web/viewer.html" ] || [ ! -d "$PDFJS_DIR/build" ]; then
            echo "PDF.js cache is missing or incomplete. Reinstalling..."
            rm -rf .pdfjs/node_modules
            npm install --prefix .pdfjs --no-save --no-package-lock --no-audit --no-fund pdfjs-dist@5.4.296
          fi

          test -f "$PDFJS_DIR/web/viewer.html"
          test -f "$PDFJS_DIR/build/pdf.mjs"
          echo "PDF.js installation is ready."

      - name: Install Vercel CLI
        run: npm install --global vercel@65.14.0

      - name: Pull Vercel Project Settings
        run: vercel pull --yes --environment=production

      - name: Prepare static site
        run: |
          set -euo pipefail

          PDFJS_DIR=".pdfjs/node_modules/pdfjs-dist"

          for file in favicon-16x16.png favicon-32x32.png cv.pdf "$PDFJS_DIR/web/viewer.html" "$PDFJS_DIR/build/pdf.mjs"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

          mkdir -p public/pdfjs
          cp favicon-16x16.png public/
          cp favicon-32x32.png public/
          cp cv.pdf "public/Youssef Atef React Frontend Engineer CV.pdf"

          cp -r "$PDFJS_DIR/web" public/pdfjs/
          cp -r "$PDFJS_DIR/build" public/pdfjs/

          for folder in cmaps standard_fonts wasm iccs; do
            if [ -d "$PDFJS_DIR/$folder" ]; then
              cp -r "$PDFJS_DIR/$folder" public/pdfjs/
            fi
          done

          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
            <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
            <meta name="theme-color" content="#111827">
            <meta name="description" content="Youssef Atef - React Frontend Engineer CV">
            <title>Youssef Atef | CV</title>
            <style>
              * { box-sizing: border-box; }
              html, body { margin: 0; width: 100%; height: 100%; }
              body { font-family: Arial, sans-serif; background: #f3f4f6; overflow: hidden; }
              header {
                height: 56px; display: flex; align-items: center;
                justify-content: space-between; padding: 0 18px;
                background: #111827; color: white; gap: 12px;
              }
              header strong { font-size: 16px; }
              header a {
                color: white; text-decoration: none; background: #2563eb;
                padding: 9px 14px; border-radius: 7px; font-size: 14px;
                white-space: nowrap;
              }
              header a:hover { background: #1d4ed8; }
              main { width: 100%; height: calc(100vh - 56px); height: calc(100dvh - 56px); }
              iframe { display: block; width: 100%; height: 100%; border: 0; }
              @media (max-width: 480px) {
                header { padding: 0 12px; }
                header strong { font-size: 14px; }
                header a { padding: 9px 11px; font-size: 13px; }
              }
            </style>
          </head>
          <body>
            <header>
              <strong>Youssef Atef | CV</strong>
              <a href="/Youssef%20Atef%20React%20Frontend%20Engineer%20CV.pdf"
                 download="Youssef Atef React Frontend Engineer CV.pdf">Download CV</a>
            </header>
            <main>
              <iframe
                src="/pdfjs/web/viewer.html?file=%2FYoussef%20Atef%20React%20Frontend%20Engineer%20CV.pdf"
                title="Youssef Atef CV">
              </iframe>
            </main>
          </body>
          </html>
          EOF

      - name: Prepare Vercel Build Output
        run: |
          set -euo pipefail
          mkdir -p .vercel/output/static
          cp -a public/. .vercel/output/static/

          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" }
            ]
          }
          EOF

          echo "=== Static output size ==="
          du -sh .vercel/output/static

          echo "=== Verify deployment files ==="
          test -f .vercel/output/static/index.html
          test -f ".vercel/output/static/Youssef Atef React Frontend Engineer CV.pdf"
          test -f .vercel/output/static/pdfjs/web/viewer.html
          test -f .vercel/output/static/favicon-16x16.png
          test -f .vercel/output/static/favicon-32x32.png
          echo "All deployment files are ready."

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod
