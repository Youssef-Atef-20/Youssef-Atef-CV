name: Build and Deploy CV

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          latexmk_use_xelatex: false

      - name: Prepare static site
        run: |
          mkdir -p public
          cp favicon-16x16.png public/favicon-16x16.png
          cp favicon-32x32.png public/favicon-32x32.png
          cp cv.pdf "public/Youssef Atef React Frontend Engineer CV.pdf"

          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
            <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
            <title>Youssef Atef | CV</title>
            <style>
              * { box-sizing: border-box; }
              html, body { margin: 0; width: 100%; height: 100%; }
              body { font-family: Arial, sans-serif; background: #f3f4f6; }
              header {
                height: 56px; display: flex; align-items: center;
                justify-content: space-between; padding: 0 18px;
                background: #111827; color: white;
              }
              header a {
                color: white; text-decoration: none;
                background: #2563eb; padding: 9px 14px;
                border-radius: 7px; font-size: 14px;
              }
              main { height: calc(100% - 56px); }
              iframe { width: 100%; height: 100%; border: 0; }
            </style>
          </head>
          <body>
            <header>
              <strong>Youssef Atef | CV</strong>
              <a href="/Youssef Atef React Frontend Engineer CV.pdf" download="Youssef Atef React Frontend Engineer CV.pdf">
                Download Cv
              </a>
            </header>
            <main>
              <iframe src="/Youssef Atef React Frontend Engineer CV.pdf" title="Youssef Atef CV"></iframe>
            </main>
          </body>
          </html>
          EOF

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Project Settings
        run: vercel pull --yes --environment=production

      - name: Build Vercel Output
        run: vercel build --prod

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod
