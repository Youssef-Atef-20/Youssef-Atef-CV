name: Build and Deploy CV

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          texlive_version: 2024
          latexmk_use_xelatex: false

      - name: Prepare static site
        run: |
          mkdir -p public
          cp favicon-16x16.png public/favicon-16x16.png
          cp favicon-32x32.png public/favicon-32x32.png
          cp cv.pdf public/cv.pdf
          cp cv.pdf "public/Youssef Atef React Frontend Engineer CV.pdf"

          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
            <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
            <title>Youssef Atef | CV</title>
          </head>
          <body>
            <h1>Youssef Atef | CV</h1>
            <p><a href="/cv.pdf">Open CV PDF</a></p>
            <p><a href="/Youssef%20Atef%20React%20Frontend%20Engineer%20CV.pdf" download="Youssef Atef React Frontend Engineer CV.pdf">Download CV</a></p>
          </body>
          </html>
          EOF

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Project Settings
        run: vercel pull --yes --environment=production

      - name: Build Vercel Output
        run: vercel build --prod

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod
