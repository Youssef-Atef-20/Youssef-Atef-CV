
name: Build and Deploy CV

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cv-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Compile CV
      - name: Compile LaTeX CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          latexmk_use_xelatex: false

      # 3. Cache PDF.js
      - name: Cache PDF.js
        id: pdfjs-cache
        uses: actions/cache@v4
        with:
          path: .pdfjs/node_modules
          key: pdfjs-${{ runner.os }}-5.4.296

      # 4. Install PDF.js if cache is missing
      - name: Install PDF.js
        if: steps.pdfjs-cache.outputs.cache-hit != 'true'
        run: |
          npm install \
            --prefix .pdfjs \
            --no-save \
            --no-package-lock \
            pdfjs-dist@5.4.296

      # 5. Prepare static website
      - name: Prepare static site
        run: |
          set -euo pipefail

          PDFJS_DIR=".pdfjs/node_modules/pdfjs-dist"

          test -f favicon-16x16.png
          test -f favicon-32x32.png
          test -f cv.pdf
          test -f "$PDFJS_DIR/web/viewer.html"

          mkdir -p public/pdfjs

          # Favicons
          cp favicon-16x16.png public/
          cp favicon-32x32.png public/

          # CV PDF
          cp cv.pdf "public/Youssef Atef React Frontend Engineer CV.pdf"

          # PDF.js viewer and engine
          cp -r "$PDFJS_DIR/web" public/pdfjs/
          cp -r "$PDFJS_DIR/build" public/pdfjs/

          # PDF.js resources
          for folder in cmaps standard_fonts wasm iccs; do
            if [ -d "$PDFJS_DIR/$folder" ]; then
              cp -r "$PDFJS_DIR/$folder" public/pdfjs/
            fi
          done

          # Website HTML
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">

            <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
            <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

            <meta name="theme-color" content="#111827">
            <meta name="description" content="Youssef Atef - React Frontend Engineer CV">

            <title>Youssef Atef | CV</title>

            <style>
              * {
                box-sizing: border-box;
              }

              html, body {
                margin: 0;
                width: 100%;
                height: 100%;
              }

              body {
                font-family: Arial, sans-serif;
                background: #f3f4f6;
                overflow: hidden;
              }

              header {
                height: 56px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 18px;
                background: #111827;
                color: white;
                gap: 12px;
              }

              header strong {
                font-size: 16px;
              }

              header a {
                color: white;
                text-decoration: none;
                background: #2563eb;
                padding: 9px 14px;
                border-radius: 7px;
                font-size: 14px;
                white-space: nowrap;
              }

              header a:hover {
                background: #1d4ed8;
              }

              main {
                width: 100%;
                height: calc(100vh - 56px);
                height: calc(100dvh - 56px);
              }

              iframe {
                display: block;
                width: 100%;
                height: 100%;
                border: 0;
              }

              @media (max-width: 480px) {
                header {
                  padding: 0 12px;
                }

                header strong {
                  font-size: 14px;
                }

                header a {
                  padding: 9px 11px;
                  font-size: 13px;
                }
              }
            </style>
          </head>

          <body>
            <header>
              <strong>Youssef Atef | CV</strong>

              <a
                href="/Youssef%20Atef%20React%20Frontend%20Engineer%20CV.pdf"
                download="Youssef Atef React Frontend Engineer CV.pdf">
                Download CV
              </a>
            </header>

            <main>
              <iframe
                src="/pdfjs/web/viewer.html?file=%2FYoussef%20Atef%20React%20Frontend%20Engineer%20CV.pdf"
                title="Youssef Atef CV">
              </iframe>
            </main>
          </body>
          </html>
          EOF

      # 6. Prepare Vercel Build Output API
      - name: Prepare Vercel Build Output
        run: |
          set -euo pipefail

          mkdir -p .vercel/output/static

          cp -a public/. .vercel/output/static/

          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              {
                "handle": "filesystem"
              }
            ]
          }
          EOF

          # Verify deployment files
          echo "=== Static output size ==="
          du -sh .vercel/output/static

          echo "=== Required files ==="
          test -f .vercel/output/static/index.html
          test -f ".vercel/output/static/Youssef Atef React Frontend Engineer CV.pdf"
          test -f .vercel/output/static/pdfjs/web/viewer.html
          test -f .vercel/output/static/favicon-16x16.png
          test -f .vercel/output/static/favicon-32x32.png

          echo "All required files are ready."

      # 7. Install Vercel CLI
      - name: Install Vercel CLI
        run: npm install --global vercel@65.14.0

      # 8. Pull Vercel project settings
      - name: Pull Vercel Project Settings
        run: vercel pull --yes --environment=production

      # 9. Deploy prebuilt output
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod
